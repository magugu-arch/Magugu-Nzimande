# Supabase CLI project config (local development only).
# Values here are local defaults, not secrets. Production settings live in the
# Supabase dashboard and in `supabase secrets set`.
project_id = "kc-one-concept"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 500

[db]
port = 54322
major_version = 17

[auth]
site_url = "kcone://"
additional_redirect_urls = ["kcone://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[storage]
file_size_limit = "50MiB"
