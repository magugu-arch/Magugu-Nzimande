<title>bb.q Chicken South Africa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   bb.q Chicken South Africa — ordering website, review build.
   Colour and type from Brand Identity Guidelines v1.0, §08 and §03.

   Deliberately single-theme: the guidelines fix white and bb.q Black as the
   two approved grounds, so every colour is painted explicitly rather than
   inherited from the host.
   ============================================================ */

:root{
  /* The palette is written in by the build from packages/ui/src/tokens.json,
     so this file holds no colour of its own and cannot drift from the brand. */
  /*__TOKENS__*/

  --display:'Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;

  --r-xs:6px; --r-sm:10px; --r:16px; --r-lg:24px; --pill:999px;
  --e1:0 1px 2px rgb(34 30 31 / .06), 0 2px 8px rgb(34 30 31 / .05);
  --e2:0 6px 18px rgb(34 30 31 / .10), 0 2px 6px rgb(34 30 31 / .06);
  --e3:0 20px 50px rgb(34 30 31 / .20);
  --wrap:1240px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--black);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{display:block; max-width:100%}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none; color:inherit}
a{color:inherit; text-decoration:none}
h1,h2,h3,h4{margin:0; font-weight:800; letter-spacing:-.01em; text-wrap:balance}
p{margin:0}
ul,ol{margin:0; padding:0; list-style:none}
table{border-collapse:collapse}
:focus-visible{outline:3px solid var(--red); outline-offset:2px; border-radius:4px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important; scroll-behavior:auto !important;
  }
}

.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
.wrap{max-width:var(--wrap); margin:0 auto; padding:0 20px}
.num{font-variant-numeric:tabular-nums}
.display{font-family:var(--display); font-weight:400; letter-spacing:.01em; line-height:.92; text-transform:uppercase}
.h-xl{font-size:clamp(40px,6.4vw,74px)}
.h-lg{font-size:clamp(30px,4.2vw,46px)}
.h-md{font-size:clamp(24px,3vw,32px)}
.h-sm{font-size:22px}
.muted{color:var(--muted)}
.stack{display:flex; flex-direction:column}

.skip{position:absolute; left:-9999px; z-index:200}
.skip:focus{left:16px; top:16px; background:var(--black); color:var(--white); padding:12px 20px; border-radius:var(--pill); font-size:14px; font-weight:700}

.eyebrow{
  font-family:var(--display); font-size:14px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--red); line-height:1;
  display:inline-flex; align-items:center; gap:10px;
}
.eyebrow::before{content:""; width:20px; height:2px; background:currentColor; flex:none}
.eyebrow.on-dark{color:var(--gold)}

/* ---------- Announcement strip ---------- */
.ticker{background:var(--red); color:var(--white); height:34px; display:flex; align-items:center; overflow:hidden}
.ticker .wrap{width:100%; text-align:center}
.ticker span{
  font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  transition:opacity .3s ease;
}
.ticker span.fade{opacity:0}

/* ---------- Utility bar ---------- */
.util{background:var(--black); color:var(--white); font-size:12px}
.util .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding-top:8px; padding-bottom:8px}
.seg{display:flex; gap:2px; background:rgb(255 255 255 / .10); border-radius:var(--pill); padding:3px}
.seg button{
  padding:5px 12px; border-radius:var(--pill); color:rgb(255 255 255 / .70);
  font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;
  transition:background-color .15s, color .15s;
}
.seg button:hover:not(:disabled){color:var(--white)}
.seg button[aria-pressed="true"]{background:var(--red); color:var(--white)}
.seg button:disabled{opacity:.4; cursor:not-allowed}
.util label{display:flex; align-items:center; gap:7px; font-weight:600; color:rgb(255 255 255 / .8)}
.util select{background:transparent; color:var(--white); font-weight:700; border:0; cursor:pointer; border-radius:4px}
.util select option{color:var(--black)}
.status{display:flex; align-items:center; gap:6px; font-weight:600; color:rgb(255 255 255 / .8)}
.status.shut{color:var(--red-60)}
.dot{width:6px; height:6px; border-radius:var(--pill); background:var(--gold); flex:none}
.status.shut .dot{background:var(--red-60)}
.util .tel{margin-left:auto; color:rgb(255 255 255 / .8); font-weight:600}
.util .tel:hover{color:var(--white)}

.flag{
  display:inline-flex; align-items:center; border:1px solid var(--gold); color:var(--gold);
  border-radius:var(--pill); padding:2px 8px; font-size:10px; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; flex:none;
}

/* ---------- Header ---------- */
.head{position:sticky; top:0; z-index:60; background:var(--white); border-bottom:1px solid var(--line)}
.head .wrap{display:flex; align-items:center; gap:20px; height:68px}
.logo{flex:none; display:block; padding:8px 0}
.logo img{height:24px; width:auto}
@media (min-width:640px){ .logo img{height:30px} }
.nav{display:none}
@media (min-width:1024px){ .nav{display:flex; gap:4px} }
.nav a{position:relative; padding:10px 13px; border-radius:var(--r-sm); font-size:13px; font-weight:700; white-space:nowrap; transition:background-color .15s}
.nav a:hover{background:var(--paper)}
.nav a.on{color:var(--red)}
.nav a.on::after{content:""; position:absolute; left:13px; right:13px; bottom:4px; height:2px; background:var(--red); border-radius:2px}
.actions{margin-left:auto; display:flex; align-items:center; gap:8px}
.icon-btn{
  width:40px; height:40px; border-radius:var(--pill); display:grid; place-items:center;
  border:1px solid var(--line); background:var(--white); transition:background-color .15s, border-color .15s;
}
.icon-btn:hover{border-color:var(--line-strong); background:var(--paper)}
.acct{display:none}
@media (min-width:640px){ .acct{display:grid} }
.burger{display:grid}
@media (min-width:1024px){ .burger{display:none} }
.basket{
  display:flex; align-items:center; gap:10px; background:var(--red); color:var(--white);
  border-radius:var(--pill); padding:0 8px 0 16px; height:44px; font-weight:700; font-size:13px;
  transition:background-color .15s;
}
.basket:hover{background:var(--red-deep)}
.basket .count{
  background:var(--white); color:var(--red); border-radius:var(--pill); min-width:26px; height:26px;
  display:grid; place-items:center; font-size:12px; font-weight:800; padding:0 7px;
}
.basket .amount{display:none}
@media (min-width:640px){ .basket .amount{display:inline} }
.mobile-nav{border-top:1px solid var(--line); background:var(--white)}
@media (min-width:1024px){ .mobile-nav{display:none} }
.mobile-nav a{display:block; padding:14px 0; border-bottom:1px solid var(--line); font-size:14px; font-weight:700}
.mobile-nav li:last-child a{border-bottom:0}
.mobile-nav a.on{color:var(--red)}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:48px; padding:0 24px; border-radius:var(--pill);
  font-weight:700; font-size:14px; text-align:center;
  transition:background-color .15s, border-color .15s, transform .1s;
}
.btn:active{transform:translateY(1px)}
.btn-red{background:var(--red); color:var(--white)}
.btn-red:hover{background:var(--red-deep)}
.btn-black{background:var(--black); color:var(--white)}
.btn-black:hover{background:var(--black-80)}
.btn-ghost{border:1.5px solid var(--line-strong); background:var(--white)}
.btn-ghost:hover{border-color:var(--black); background:var(--paper)}
.btn-ghost-dark{border:1.5px solid rgb(255 255 255 / .3); color:var(--white)}
.btn-ghost-dark:hover{border-color:var(--white); background:rgb(255 255 255 / .08)}
.btn-sm{height:38px; padding:0 16px; font-size:13px}
.btn-block{width:100%}
.btn:disabled{opacity:.45; pointer-events:none}

/* ---------- Hero ---------- */
.hero{background:var(--black); color:var(--white)}
.hero .wrap{display:grid; gap:32px; align-items:center; padding-top:56px; padding-bottom:56px}
@media (min-width:1024px){ .hero .wrap{grid-template-columns:1.05fr .95fr; padding-top:64px; padding-bottom:64px} }
.hero h1{color:var(--white)}
.hero h1 em{font-style:normal; color:var(--red)}
.hero .lede{color:rgb(255 255 255 / .72); max-width:44ch; margin-top:16px}
.craft{
  margin-top:20px; display:inline-flex; align-items:center; gap:10px; font-family:var(--display);
  font-size:15px; letter-spacing:.14em; color:var(--gold); text-transform:uppercase;
}
.craft::before{content:""; width:26px; height:2px; background:var(--gold); flex:none}
.hero-cta{display:flex; gap:12px; margin-top:28px; flex-wrap:wrap}
.hero-media{position:relative}
.hero-media img{width:100%; border-radius:var(--r-lg); box-shadow:var(--e3); aspect-ratio:16/9; object-fit:cover}
.hero-flag{
  position:absolute; left:16px; bottom:-18px; display:flex; align-items:center; gap:12px;
  background:var(--white); color:var(--black); border-radius:var(--pill); padding:10px 20px 10px 12px; box-shadow:var(--e2);
}
.hero-flag .rank{width:40px; height:40px; border-radius:var(--pill); background:var(--red); color:var(--white); display:grid; place-items:center; font-size:12px; font-weight:800; flex:none}
.hero-flag .lbl{display:block; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.hero-flag .nm{display:block; font-size:14px; font-weight:800}

/* ---------- Sections ---------- */
.band{background:var(--white); border-bottom:1px solid var(--line)}
.band .wrap{display:grid; gap:32px; padding:48px 20px}
@media (min-width:768px){ .band .wrap{grid-template-columns:repeat(3,1fr)} }
.band .step{font-family:var(--display); font-size:30px; color:var(--red-40); line-height:1}
.section{padding:56px 0}
.section-dark{background:var(--black); color:var(--white)}
.head-row{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px}

.grid{display:grid; gap:20px}
.grid-2{grid-template-columns:1fr}
@media (min-width:640px){ .grid-2{grid-template-columns:repeat(2,1fr)} }
.grid-4{grid-template-columns:1fr}
@media (min-width:640px){ .grid-4{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1024px){ .grid-4{grid-template-columns:repeat(4,1fr)} }
.grid-3{grid-template-columns:1fr}
@media (min-width:768px){ .grid-3{grid-template-columns:repeat(3,1fr)} }

/* ---------- Product card ---------- */
.card{
  position:relative; display:flex; flex-direction:column; height:100%;
  background:var(--white); border-radius:var(--r); overflow:hidden; box-shadow:var(--e1);
  transition:box-shadow .2s;
}
.card:hover{box-shadow:var(--e2)}
.card .shot{position:relative; aspect-ratio:4/5; background:var(--paper); overflow:hidden}
.card .shot img{width:100%; height:100%; object-fit:cover; transition:transform .5s}
.card:hover .shot img{transform:scale(1.04)}
.tag{
  position:absolute; left:12px; top:12px; background:var(--yellow); color:var(--black);
  border-radius:var(--pill); padding:4px 10px; font-size:10px; font-weight:800;
  letter-spacing:.08em; text-transform:uppercase;
}
.soldout{position:absolute; inset:0; display:grid; place-items:center; background:rgb(34 30 31 / .65)}
.soldout span{font-family:var(--display); font-size:18px; color:var(--white); border:2px solid var(--white); border-radius:var(--pill); padding:6px 16px; text-transform:uppercase}
.card .body{display:flex; flex-direction:column; flex:1; padding:16px}
.card .title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
.card h3{font-size:15px; font-weight:800; line-height:1.2}
.card h3 a::after{content:""; position:absolute; inset:0}
.card .price{font-size:14px; font-weight:800; color:var(--red); flex:none}
.card .desc{margin-top:6px; font-size:12px; line-height:1.6; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card .foot{margin-top:12px; padding-top:4px; display:flex; align-items:center; justify-content:space-between; gap:8px}
.card .sauce{font-size:11px; font-weight:600; color:var(--muted)}

/* A grid child defaults to min-width:auto and refuses to shrink below its
   content, which pushed the menu's search and sort row past the viewport at
   320px. Every grid here is allowed to shrink instead. */
.grid > *, [id$="-grid"] > *{min-width:0}

/* ---------- Heat meter ---------- */
.heat{display:inline-flex; align-items:center; gap:4px}
.heat i{display:block; width:12px; height:6px; border-radius:var(--pill); background:var(--black-20)}
.heat i.on{background:var(--red)}
.heat.on-dark i{background:rgb(255 255 255 / .2)}
.heat.on-dark i.on{background:var(--red)}

/* ---------- Rails ---------- */
.rail{display:flex; gap:16px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.sauce-card{width:210px; flex:none; border:1px solid rgb(255 255 255 / .15); background:rgb(255 255 255 / .05); border-radius:var(--r); padding:16px}
.cat{position:relative; display:block; border-radius:var(--r); overflow:hidden; background:var(--black); color:var(--white); box-shadow:var(--e1)}
.cat img{height:160px; width:100%; object-fit:cover; opacity:.62; transition:transform .5s}
.cat:hover img{transform:scale(1.05)}
.cat .over{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:16px}

/* ---------- Panels, forms ---------- */
.panel{background:var(--white); border:1px solid var(--line); border-radius:var(--r); padding:24px}
.panel-flat{background:var(--white); border:1px solid var(--line); border-radius:var(--r)}
.notice{border:1px solid var(--gold); background:var(--white); border-radius:var(--r); padding:16px 20px}
.field{display:block}
.field .lbl{display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.field input,.field textarea,.field select{
  margin-top:6px; width:100%; border:1px solid var(--line); background:var(--white);
  border-radius:var(--r-sm); padding:0 14px; height:48px; font-size:14px;
}
.field textarea{height:auto; padding:12px 14px; resize:vertical}
.field input[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:var(--red)}
.err{margin-top:6px; font-size:12px; font-weight:600; color:var(--red)}
.hint{margin-top:6px; font-size:12px; color:var(--muted)}

.chip{
  border:1px solid var(--line); background:var(--white); border-radius:var(--pill);
  padding:10px 16px; font-size:13px; font-weight:700; white-space:nowrap;
  transition:background-color .15s, border-color .15s, color .15s;
}
.chip:hover{border-color:var(--line-strong); background:var(--paper)}
.chip[aria-pressed="true"]{background:var(--red); border-color:var(--red); color:var(--white)}
.chip .delta{margin-left:8px; color:var(--muted); font-weight:600}
.chip[aria-pressed="true"] .delta{color:rgb(255 255 255 / .8)}
.chips{display:flex; flex-wrap:wrap; gap:8px}

fieldset{border:0; padding:0; margin:0 0 24px}
legend{margin-bottom:10px; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

/* ---------- Stepper ---------- */
.stepper{display:flex; align-items:center; gap:4px; border:1px solid var(--line); background:var(--white); border-radius:var(--pill); padding:4px}
.stepper button{width:32px; height:32px; border-radius:var(--pill); display:grid; place-items:center; font-size:18px; line-height:1; transition:background-color .15s}
.stepper button:hover:not(:disabled){background:var(--paper)}
.stepper button:disabled{opacity:.3; cursor:not-allowed}
.stepper .qty{width:24px; text-align:center; font-size:14px; font-weight:700}

/* ---------- Drawer ---------- */
.scrim{position:fixed; inset:0; z-index:80; background:rgb(34 30 31 / .5); opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; bottom:0; z-index:90; width:100%; max-width:420px;
  background:var(--white); box-shadow:var(--e3); display:flex; flex-direction:column;
  transform:translateX(100%); transition:transform .25s ease-out;
}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line)}
.drawer-body{flex:1; overflow-y:auto; padding:0 20px}
.drawer-foot{border-top:1px solid var(--line); padding:16px 20px}
.empty{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:0 32px; text-align:center}

.meter{margin-top:16px; background:var(--paper); border-radius:var(--r-sm); padding:12px}
.bar{margin-top:8px; height:6px; border-radius:var(--pill); background:var(--black-20); overflow:hidden}
.bar span{display:block; height:100%; border-radius:var(--pill); background:var(--red); transition:width .3s}

.line{display:flex; gap:12px; padding:16px 0; border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .shot{width:72px; height:72px; flex:none; border-radius:var(--r-sm); overflow:hidden; background:var(--paper)}
.line .shot img{width:100%; height:100%; object-fit:cover}
.line .info{flex:1; min-width:0}
.line .nm{font-size:14px; font-weight:700}
.line .opt{margin-top:2px; font-size:12px; color:var(--muted)}
.line .row{margin-top:8px; display:flex; align-items:center; justify-content:space-between; gap:8px}

.totals{margin:0; font-size:14px}
.totals .row{display:flex; justify-content:space-between; gap:12px; padding:4px 0}
.totals .row.discount{color:var(--red); font-weight:600}
.totals .row.grand{margin-top:8px; padding-top:10px; border-top:1px solid var(--line); font-size:16px; font-weight:800}
.totals dt{display:flex; align-items:center; gap:8px; color:var(--muted)}
.totals .grand dt{color:var(--black)}

.suggest{display:flex; gap:8px; overflow-x:auto; margin-top:12px; scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.suggest button{width:128px; flex:none; border:1px solid var(--line); border-radius:var(--r-sm); padding:8px; text-align:left; transition:background-color .15s, border-color .15s}
.suggest button:hover{border-color:var(--line-strong); background:var(--paper)}
.suggest .shot{aspect-ratio:4/5; border-radius:var(--r-xs); overflow:hidden; background:var(--paper); margin-bottom:8px}
.suggest img{width:100%; height:100%; object-fit:cover}
.suggest .nm{display:block; font-size:12px; font-weight:700; line-height:1.3}
.suggest .pr{font-size:12px; color:var(--red); font-weight:700}

/* ---------- Checkout ---------- */
.steps{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px}
.steps li{display:flex; align-items:center; gap:8px}
.steps .pill{display:flex; align-items:center; gap:8px; border-radius:var(--pill); padding:6px 14px; font-size:12px; font-weight:700; background:var(--paper); color:var(--muted)}
.steps .pill.done{background:var(--red-10); color:var(--red)}
.steps .pill.now{background:var(--red); color:var(--white)}
.steps .sep{width:12px; height:1px; background:var(--line-strong)}
.pick{border:1px solid var(--line); background:var(--white); border-radius:var(--r); padding:16px; text-align:left; transition:border-color .15s, background-color .15s}
.pick:hover:not(:disabled){border-color:var(--line-strong)}
.pick[aria-pressed="true"]{border-color:var(--red); background:var(--red-10)}
.pick:disabled{opacity:.45; cursor:not-allowed}
.pick .nm{display:block; font-size:14px; font-weight:800}
.pick .sub{display:block; margin-top:4px; font-size:12px; color:var(--muted)}
.ok-note{background:var(--red-10); color:var(--red); border-radius:var(--r-sm); padding:10px 14px; font-size:12px; font-weight:600}

/* ---------- Journey ---------- */
.timeline li{display:flex; gap:16px}
.timeline .mark{display:flex; flex-direction:column; align-items:center}
.timeline .bead{
  width:32px; height:32px; flex:none; border-radius:var(--pill); display:grid; place-items:center;
  border:2px solid var(--line); background:var(--white); color:var(--black-40); font-size:12px; font-weight:800;
}
.timeline .bead.on{border-color:var(--red); background:var(--red); color:var(--white)}
.timeline .stem{flex:1; width:2px; background:var(--line)}
.timeline .stem.on{background:var(--red)}
.timeline .txt{padding-bottom:28px}
.timeline li:last-child .txt{padding-bottom:0}
.timeline .lbl{font-size:14px; font-weight:800; color:var(--black-40)}
.timeline .lbl.done{color:var(--black)}
.timeline .lbl.now{color:var(--red)}
.timeline .msg{margin-top:4px; max-width:46ch; font-size:12px; line-height:1.6; color:var(--muted)}

.badge{border-radius:var(--pill); padding:5px 12px; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase}
.badge-red{background:var(--red); color:var(--white)}
.badge-soft{background:var(--red-10); color:var(--red)}

/* ---------- 2. Helpers -------------------------------------- */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/** The only place cents becomes text. */
function money(cents){
  const value = (Math.round(cents) / 100).toFixed(2);
  const [whole, part] = value.split('.');
  return 'R' + whole.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + '.' + part;
}
function moneyShort(cents){
  const out = money(cents);
  return out.endsWith('.00') ? out.slice(0, -3) : out;
}

const flag = (label) => DEMO ? '<span class="flag">' + esc(label || 'Demo') + '</span>' : '';

function heat(level, dark){
  if(level <= 0) return '<span class="xs muted">Mild</span>';
  let out = '<span class="heat' + (dark ? ' on-dark' : '') + '" role="img" aria-label="Heat ' + level + ' of 5">';
  for(let i = 1; i <= 5; i++) out += '<i' + (i <= level ? ' class="on"' : '') + '></i>';
  return out + '</span>';
}

/** South African time, because "open now" is a fact about the store. */
function minutesNow(){
  const now = new Date();
  return (now.getUTCHours() * 60 + now.getUTCMinutes() + 120) % 1440;
}
function isOpen(store){
  const m = minutesNow();
  return store.closes > store.opens
    ? (m >= store.opens && m < store.closes)
    : (m >= store.opens || m < store.closes);
}

const product = (slug) => PRODUCTS.find((p) => p.slug === slug);
const store = () => STORES.find((s) => s.id === S.storeId) || STORES[0];

/** Store services with any console overrides applied. */
function services(s){
  return Object.assign({}, s.services, S.serviceOverrides[s.id] || {});
}
const serves = (s, mode) => services(s)[mode] === true;

const isSoldOut = (slug) => S.soldOut.includes(slug);

/** Hidden products are absent from the catalogue; sold out ones are flagged. */

/* ---------- 3. Options --------------------------------------
   Derived from the category, so a new product needs no new UI.
   ---------------------------------------------------------- */

const EXTRAS = {key:'extras', label:'Add to it', multi:true, def:0, choices:[
  {label:'Extra dipping sauce', delta:1500},
  {label:'Pickled radish', delta:1500},
  {label:'Cheese dust', delta:2000},
]};

function optionGroups(p){
  const groups = [];
  const sauceChoices = SAUCES.map((s) => ({label:s.name, delta:0}));

  if(p.category === 'Chicken'){
    groups.push({key:'size', label:'Size', multi:false, def:0, choices:[
      {label:'Whole bird', delta:0}, {label:'Half bird', delta:-7000},
    ]});
    if(p.slug === 'half-half'){
      groups.push({key:'sauceA', label:'First sauce', multi:false, def:0, choices:sauceChoices});
      groups.push({key:'sauceB', label:'Second sauce', multi:false, def:1, choices:sauceChoices});
    }
  }
  if(p.category === 'Wings'){
    groups.push({key:'portion', label:'Portion', multi:false, def:0, choices:[
      {label:'12 pieces', delta:0}, {label:'20 pieces', delta:9000},
    ]});
    groups.push({key:'sauce', label:'Sauce', multi:false, def:0, choices:[
      {label:'On the side', delta:0}, {label:'Tossed to order', delta:0},
    ]});
  }
  if(p.category === 'Meals'){
    groups.push({key:'drink', label:'Drink', multi:false, def:0, choices:[
      {label:'Cola', delta:0}, {label:'Lemonade', delta:0}, {label:'Still water', delta:0},
    ]});
  }
  if(p.category === 'Sides'){
    groups.push({key:'size', label:'Size', multi:false, def:0, choices:[
      {label:'Regular', delta:0}, {label:'Large', delta:2000},
    ]});
  }
  groups.push(EXTRAS);
  return groups;
}

const EXCLUSIVE = ['sauceA','sauceB'];

function defaultSelection(groups){
  const sel = {};
  for(const g of groups) sel[g.key] = g.multi ? [] : [(g.choices[g.def] || g.choices[0]).label];
  return sel;
}

/**
 * Half and Half may never hold the same sauce twice: choosing a sauce the
 * other half already holds moves that half to the first one still free.
 */
function chooseOption(groups, sel, group, label){
  if(group.multi){
    const chosen = sel[group.key] || [];
    const next = Object.assign({}, sel);
    next[group.key] = chosen.includes(label)
      ? chosen.filter((c) => c !== label)
      : chosen.concat([label]);
    return next;
  }

  const next = Object.assign({}, sel);
  next[group.key] = [label];

  if(EXCLUSIVE.includes(group.key)){
    const otherKey = EXCLUSIVE.find((k) => k !== group.key);
    const other = groups.find((g) => g.key === otherKey);
    if(other && next[otherKey] && next[otherKey][0] === label){
      const free = other.choices.find((c) => c.label !== label);
      if(free) next[otherKey] = [free.label];
    }
  }
  return next;
}

function unitPrice(base, groups, sel){
  let total = base;
  for(const g of groups){
    for(const label of (sel[g.key] || [])){
      const choice = g.choices.find((c) => c.label === label);
      if(choice) total += choice.delta;
    }
  }
  return total;
}

function selectedOptions(groups, sel){
  return groups
    .map((g) => ({key:g.key, label:g.label, choices:sel[g.key] || []}))
    .filter((o) => o.choices.length > 0);
}

function lineKey(slug, options){
  const canonical = options
    .map((o) => o.key + ':' + o.choices.slice().sort().join('|'))
    .sort().join(';');
  return slug + '::' + canonical;
}

const describeOptions = (options) =>
  options.reduce((all, o) => all.concat(o.choices), []).join(' · ');

const subtotal = () => S.lines.reduce((sum, l) => sum + l.unitCents * l.qty, 0);

function discount(){
  const promo = promotion(S.promoCode);
  return promo ? Math.round(subtotal() * promo.rate) : 0;
}

/**
 * Delivery is charged on the subtotal after discount, so a promo code cannot
 * buy free delivery the customer has not actually paid past.
 */
function deliveryFee(){
  if(S.mode !== 'Delivery' || S.lines.length === 0) return 0;
  return (subtotal() - discount()) >= FEES.freeOverCents ? 0 : FEES.deliveryCents;
}

const grandTotal = () => subtotal() - discount() + deliveryFee();
const itemCount = () => S.lines.reduce((n, l) => n + l.qty, 0);
const remainingToFree = () => Math.max(0, FEES.freeOverCents - (subtotal() - discount()));
const pointsFor = (cents) => Math.floor(cents / 100);

const statesFor = (mode) => mode === 'Delivery'
  ? ORDER_STATES.slice()
  : ORDER_STATES.filter((s) => s !== 'out_for_delivery');

const completedLabel = (mode) =>
  mode === 'Delivery' ? 'Delivered' : (mode === 'Collection' ? 'Collected' : 'Served');

function stateLabel(state, mode){
  if(state === 'cancelled') return 'Cancelled';
  if(state === 'completed') return completedLabel(mode);
  return {received:'Order received', preparing:'Preparing', ready:'Ready', out_for_delivery:'On the way'}[state];
}

/* ---------- 5. State ---------------------------------------- */

const STORAGE_KEY = 'bbq.review.v1';

const S = {
  route:'/', mode:'Delivery', storeId:'ST-CRE',
  lines:[], promoCode:null, orders:[],
  soldOut:[], hidden:[], serviceOverrides:{},
  audit:[{at:new Date().toISOString(), who:'system', what:'Demo catalogue loaded (16 products)'}],
  menu:{search:'', category:'all', heatMax:5, sort:'popular'},
  checkout:{step:0, name:'', email:'', mobile:'', address:'', suburb:'', note:'', errors:{}, quote:null},
  product:null, adminTab:'Orders', menuOpen:false, drawerOpen:false, sequence:0, trackedId:null,
};

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      mode:S.mode, storeId:S.storeId, lines:S.lines, promoCode:S.promoCode, orders:S.orders,
      soldOut:S.soldOut, hidden:S.hidden, serviceOverrides:S.serviceOverrides, audit:S.audit,
      sequence:S.sequence,
    }));
  }catch(e){ /* A private window is not a reason to break the basket. */ }
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    Object.assign(S, JSON.parse(raw));
  }catch(e){ /* Unreadable storage falls back to a fresh session. */ }
}

function audit(who, what){
  S.audit.unshift({at:new Date().toISOString(), who, what});
  if(S.audit.length > 200) S.audit.length = 200;
  save();
}

/* ---------- 6. Announcements and toast ---------------------- */

let toastTimer;
function toast(message){
  const node = $('toast');
  node.textContent = message;
  node.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove('show'), 3200);
  announce(message);
}

function announce(message){
  const region = $('live');
  region.textContent = '';
  setTimeout(() => { region.textContent = message; }, 60);
}

/* ---------- 7. Cart ----------------------------------------- */

function addLine(p, options, qty, unitCents){
  const key = lineKey(p.slug, options);
  const found = S.lines.find((l) => l.key === key);
  if(found) found.qty += qty;
  else S.lines.push({key, slug:p.slug, name:p.name, img:p.img, qty, unitCents, options});
  save();
  toast(qty + ' × ' + p.name + ' added to your basket');
}

function setQty(key, qty){
  const line = S.lines.find((l) => l.key === key);
  if(!line) return;
  if(qty < 1){
    S.lines = S.lines.filter((l) => l.key !== key);
    announce(line.name + ' removed from your basket.');
  } else {
    line.qty = qty;
  }
  save();
  render();
}

function applyPromo(code){
  const promo = promotion(code);
  if(!promo){ toast('That code is not valid.'); return; }
  S.promoCode = promo.code;
  save();
  toast('Promo code ' + promo.code + ' applied');
  render();
}

/* ---------- 8. Ordering rules ------------------------------- */

function setMode(mode){
  if(!serves(store(), mode)){
    toast(store().name + ' is not taking ' + mode.toLowerCase() + ' orders.');
    return;
  }
  S.mode = mode;
  save();
  announce('Switched to ' + mode.toLowerCase() + '.');
  render();
}

/**
 * Waterfall Ridge has dine-in off, so choosing it while in dine-in moves the
 * order to collection rather than leaving one the store cannot accept.
 */
function setStore(id){
  const next = STORES.find((s) => s.id === id);
  if(!next) return;
  S.storeId = id;
  if(!serves(next, S.mode)){
    const was = S.mode;
    S.mode = 'Collection';
    toast(next.name + ' is not taking ' + was.toLowerCase() + ' orders. Switched to collection.');
  }
  save();
  render();
}

function placeOrder(){
  const c = S.checkout;
  S.sequence += 1;
  const stamp = new Date().toISOString().slice(2, 10).replace(/-/g, '');
  const totals = {
    subtotalCents:subtotal(), discountCents:discount(),
    deliveryCents:deliveryFee(), totalCents:grandTotal(),
  };
  const order = {
    id:'O-' + Date.now() + '-' + S.sequence,
    orderNumber:'BBQ-' + stamp + '-' + String(S.sequence).padStart(4, '0'),
    storeId:S.storeId, mode:S.mode, status:'received', cancelledReason:null,
    placedAt:new Date().toISOString(),
    eta:S.mode === 'Delivery' ? FEES.etaMax : FEES.collectEta,
    lines:S.lines.slice(), totals, promoCode:S.promoCode,
    address:S.mode === 'Delivery' ? c.address : null,
    note:c.note, points:pointsFor(totals.totalCents),
    customer:{name:c.name, email:c.email, mobile:c.mobile},
  };
  S.orders.unshift(order);
  S.trackedId = order.id;
  S.lines = [];
  S.promoCode = null;
  S.checkout = {step:0, name:c.name, email:c.email, mobile:c.mobile, address:c.address, suburb:c.suburb, note:'', errors:{}, quote:null};
  audit('customer', 'Order ' + order.orderNumber + ' placed (' + order.mode + ')');
  announce('Order ' + order.orderNumber + ' placed.');
  go('/journey');
}

/** Moves an order one state along. Returns it if it moved, null if it could not. */
function stepOrder(id){
  const order = S.orders.find((o) => o.id === id);
  if(!order || order.status === 'cancelled' || order.status === 'completed') return null;
  const states = statesFor(order.mode);
  const at = states.indexOf(order.status);
  if(at === -1 || at === states.length - 1) return null;
  order.status = states[at + 1];
  audit('kitchen', 'Order ' + order.orderNumber + ' moved to ' + stateLabel(order.status, order.mode));
  return order;
}

function advanceOrder(id){
  const order = stepOrder(id);
  if(!order) return;
  announce('Order status: ' + stateLabel(order.status, order.mode) + '.');
  render();
}

function setOrderStatus(id, status){
  const order = S.orders.find((o) => o.id === id);
  if(!order) return;
  let reason = null;
  if(status === 'cancelled'){
    reason = window.prompt('Why is this order being cancelled?');
    if(!reason || !reason.trim()) return;
    reason = reason.trim();
  }
  order.status = status;
  order.cancelledReason = reason;
  audit('operations', status === 'cancelled'
    ? 'Order ' + order.orderNumber + ' cancelled: ' + reason
    : 'Order ' + order.orderNumber + ' moved to ' + stateLabel(status, order.mode));
  render();
}

function reorder(order){
  for(const line of order.lines){
    const p = product(line.slug);
    if(p) addLine(p, line.options, line.qty, line.unitCents);
  }
  render();
}

/* ---------- 9. Menu filtering ------------------------------- */

const SORTS = {
  popular:'Most popular', 'price-low':'Price, low to high',
  'price-high':'Price, high to low', heat:'Heat, mild to hot',
};

function filteredMenu(){
  const f = S.menu;
  const needle = f.search.trim().toLowerCase();
  let out = catalogue().filter((p) => {
    const hay = (p.name + ' ' + p.sauce + ' ' + p.category + ' ' + p.desc).toLowerCase();
    const matches = !needle || needle.split(/\s+/).every((w) => hay.includes(w));
    return matches && (f.category === 'all' || p.category === f.category) && p.heat <= f.heatMax;
  });
  if(f.sort === 'price-low') out.sort((a, b) => a.priceCents - b.priceCents);
  else if(f.sort === 'price-high') out.sort((a, b) => b.priceCents - a.priceCents);
  else if(f.sort === 'heat') out.sort((a, b) => a.heat - b.heat);
  else out.sort((a, b) => Number(Boolean(b.tag)) - Number(Boolean(a.tag)));
  return out;
}

/* ---------- 10. Validation ---------------------------------- */

const SA_MOBILE = /^(?:\+?27|0)[6-8][0-9]{8}$/;
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function validateDetails(){
  const c = S.checkout;
  const errors = {};
  if(c.name.trim().length < 2) errors.name = 'Enter your name';
  if(!EMAIL.test(c.email.trim())) errors.email = 'Enter a valid email address';
  if(!SA_MOBILE.test(c.mobile.replace(/[\s()-]/g, ''))) errors.mobile = 'Enter a South African mobile number';
  c.errors = errors;
  return Object.keys(errors).length === 0;
}

/** The delivery quote, run against the same zone lists the API uses. */
function quoteDelivery(suburb){
  const wanted = suburb.trim().toLowerCase();
  const match = STORES.find((s) => serves(s, 'Delivery') && s.zones.some((z) => z.toLowerCase() === wanted));
  if(!match){
    return {serviceable:false, reason:'We do not deliver to this suburb yet. Collection is available at both stores.'};
  }
  return {serviceable:true, feeCents:deliveryFee(), eta:FEES.etaMax, storeId:match.id};
}

function validateWhere(){
  const c = S.checkout;
  if(S.mode !== 'Delivery'){ c.errors = {}; return true; }
  const errors = {};
  if(c.address.trim().length < 4) errors.address = 'Enter your street address';
  if(c.suburb.trim().length < 2) errors.suburb = 'Enter your suburb';
  if(Object.keys(errors).length){ c.errors = errors; return false; }

  const quote = quoteDelivery(c.suburb);
  c.quote = quote;
  if(!quote.serviceable){
    c.errors = {suburb:quote.reason};
    announce(quote.reason);
    return false;
  }
  c.errors = {};
  return true;
}

    + esc(c.label) + '</button></li>').join('');

  const body = results.length === 0
    ? '<div class="panel center mt-8" style="padding:40px"><p class="display h-md" style="color:var(--black-60)">Nothing matches that</p>'

  return ''
    + '<div style="background:var(--white);border-bottom:1px solid var(--line)"><div class="wrap" style="padding:40px 20px">'
      + '<p class="eyebrow">The full range</p>'

        + '<ul class="stack mt-3" style="gap:4px">' + sideList + '</ul>'
        + '<h2 class="xxs b muted mt-8" style="letter-spacing:.1em;text-transform:uppercase">Maximum heat</h2>'

          + '<input type="range" min="0" max="5" step="1" value="' + S.menu.heatMax + '" data-action="heat"></label>'
        + '<p class="xs muted mt-1" aria-live="polite">' + (S.menu.heatMax === 5 ? 'Everything, up to hot' : 'Up to heat ' + S.menu.heatMax) + '</p>'
      + '</aside>'

          + '<label class="flex-1" style="min-width:140px"><span class="sr">Search the menu</span>'
            + '<input type="search" id="menu-search" value="' + esc(S.menu.search) + '" data-action="search" placeholder="Search chicken, wings, sauces"'
            + ' style="width:100%;height:44px;border:1px solid var(--line);border-radius:var(--pill);padding:0 16px;font-size:14px;background:var(--white)"></label>'
          + '<label><span class="sr">Sort by</span>'
            + '<select data-action="sort" style="height:44px;border:1px solid var(--line);border-radius:var(--pill);padding:0 16px;font-size:14px;font-weight:600;background:var(--white)">'
            + Object.keys(SORTS).map((k) => '<option value="' + k + '"' + (S.menu.sort === k ? ' selected' : '') + '>' + SORTS[k] + '</option>').join('')
            + '</select></label>'

        + '<ul class="rail mt-4" id="menu-chips">' + chipRow + '</ul>'

/* ---------- Product ---------- */

function viewProduct(slug){
  const p = product(slug);
  if(!p || isHidden(slug)){
    return '<div class="wrap" style="padding:80px 20px"><div class="panel center">'
      + '<p class="display h-md" style="color:var(--black-60)">We cannot find that one</p>'
      + '<p class="sm muted mt-2">It may have come off the menu.</p>'
      + '<div class="mt-5"><a class="btn btn-red" href="#/menu">Back to the menu</a></div></div></div>';
  }

  const groups = optionGroups(p);
  if(!S.product || S.product.slug !== slug){
    S.product = {slug, sel:defaultSelection(groups), qty:1};
  }
  const state = S.product;
  const price = unitPrice(p.priceCents, groups, state.sel);
  const soldOut = isSoldOut(slug);

  const fields = groups.map((g) =>
    '<fieldset><legend>' + esc(g.label) + (g.multi ? ' <span style="font-weight:600;text-transform:none;letter-spacing:0">Optional</span>' : '') + '</legend>'
    + '<div class="chips">' + g.choices.map((c) => {
        const chosen = (state.sel[g.key] || []).includes(c.label);
        return '<button type="button" class="chip" data-action="option" data-group="' + g.key + '" data-value="' + esc(c.label) + '" aria-pressed="' + chosen + '">'
          + esc(c.label)
          + (c.delta !== 0 ? '<span class="delta num">' + (c.delta > 0 ? '+' : '−') + moneyShort(Math.abs(c.delta)) + '</span>' : '')
          + '</button>';
      }).join('') + '</div></fieldset>').join('');

  const related = catalogue().filter((c) => c.category === p.category && c.slug !== slug).slice(0, 4);

  return '<div class="wrap" style="padding:32px 20px">'
    + '<nav aria-label="Breadcrumb" class="xs b muted" style="margin-bottom:20px">'
      + '<a href="#/menu">Menu</a><span aria-hidden="true" style="margin:0 8px">/</span><span>' + esc(p.category) + '</span></nav>'
    + '<div class="grid" style="grid-template-columns:1fr;gap:40px" id="product-grid">'
      + '<div>'
        + '<div style="border-radius:var(--r-lg);overflow:hidden;background:var(--paper);box-shadow:var(--e1)">'
          + '<img src="' + IMG[p.img] + '" alt="' + esc(p.name) + '" style="width:100%"></div>'
        + '<section class="panel mt-6">'
          + '<h2 class="xxs b muted" style="letter-spacing:.1em;text-transform:uppercase">Allergens and energy</h2>'
          + '<dl class="grid grid-2 mt-3">'
            + '<div><dt class="xs muted">Contains</dt><dd class="sm b mt-1">' + esc(p.allergens) + '</dd></div>'
            + '<div><dt class="xs muted">Indicative energy</dt><dd class="sm b num mt-1">' + p.kj.toLocaleString('en-ZA') + ' kJ</dd></div>'
          + '</dl>'
          + '<p class="xs muted mt-3" style="line-height:1.7">Indicative values pending the franchisor nutritional analysis. Prepared in a kitchen that handles wheat, soya, milk, egg, sesame and fish. ' + flag() + '</p>'
        + '</section>'
      + '</div>'
      + '<div>'
        + (p.tag ? '<span class="tag" style="position:static;display:inline-block;margin-bottom:12px">' + esc(p.tag) + '</span>' : '')
        + '<h1 class="display h-lg">' + esc(p.name) + '</h1>'
        + '<div class="row-wrap mt-3 gap-4">'
          + '<span class="red num" style="font-size:26px;font-weight:800">' + moneyShort(p.priceCents) + '</span>'
          + heat(p.heat) + '<span class="xs b muted">' + esc(p.sauce) + '</span>' + flag('Demo price')
        + '</div>'
        + '<p class="sm muted mt-4 max-56" style="line-height:1.7">' + esc(p.desc) + '</p>'
        + '<hr style="margin:28px 0;border:0;border-top:1px solid var(--line)">'
        + (soldOut
            ? '<div class="panel"><p class="display h-md" style="color:var(--black-60)">Sold out today</p>'
              + '<p class="sm muted mt-2">This one has gone for the day. The kitchen restocks each morning.</p>'
              + '<div class="mt-5"><a class="btn btn-ghost" href="#/menu">Back to the menu</a></div></div>'
            : fields
              + '<div class="row-wrap" style="position:sticky;bottom:0;background:rgb(247 245 242 / .95);padding:16px 0;backdrop-filter:blur(6px)">'
                + '<div class="stepper">'
                  + '<button type="button" data-action="pqty" data-value="-1" aria-label="One fewer ' + esc(p.name) + '"' + (state.qty <= 1 ? ' disabled' : '') + '>−</button>'
                  + '<span class="qty num" aria-hidden="true">' + state.qty + '</span>'
                  + '<button type="button" data-action="pqty" data-value="1" aria-label="One more ' + esc(p.name) + '">+</button>'
                + '</div>'
                + '<button type="button" class="btn btn-red flex-1" data-action="add">Add to basket <span aria-hidden="true" style="opacity:.7">·</span> <span class="num">' + money(price * state.qty) + '</span></button>'
              + '</div>')
      + '</div>'
    + '</div>'
    + (related.length ? '<section class="mt-12"><h2 class="display h-md">More ' + esc(p.category.toLowerCase()) + '</h2>'
        + '<ul class="grid grid-4 mt-5">' + related.map((c) =>
            '<li><a class="panel-flat" href="#/menu/' + c.slug + '" style="display:flex;gap:12px;padding:12px;align-items:center">'
            + '<span style="width:64px;height:64px;flex:none;border-radius:var(--r-sm);overflow:hidden;background:var(--paper)">'
            + '<img src="' + IMG[c.img] + '" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></span>'
            + '<span style="min-width:0"><span class="sm b" style="display:block;line-height:1.3">' + esc(c.name) + '</span>'
            + '<span class="xs red num mt-1" style="display:block">' + moneyShort(c.priceCents) + '</span></span></a></li>').join('')
        + '</ul></section>' : '')
    + '</div>';
}

/* ---------- Rewards ---------- */

function viewRewards(){
  const earned = S.orders.filter((o) => o.status === 'completed').reduce((n, o) => n + pointsFor(o.totals.totalCents), 0);
  const pending = S.orders.filter((o) => o.status !== 'completed' && o.status !== 'cancelled').reduce((n, o) => n + pointsFor(o.totals.totalCents), 0);

  return '<div class="wrap" style="padding:40px 20px">'
    + '<p class="eyebrow">bb.q Rewards</p>'
    + '<h1 class="display h-lg mt-2">Every rand earns a point</h1>'
    + '<p class="sm muted mt-3 max-56">Points post once your order is completed, on every fulfilment mode, and can be spent on anything you have reached. ' + flag() + '</p>'
    + '<div class="mt-8" style="background:var(--black);color:var(--white);border-radius:var(--r-lg);padding:32px">'
      + '<p class="xxs b gold" style="letter-spacing:.12em;text-transform:uppercase">Your balance</p>'
      + '<p class="display num mt-2" style="font-size:58px">' + earned.toLocaleString('en-ZA') + '</p>'
      + '<p class="sm mt-1" style="color:rgb(255 255 255 / .6)">points' + (pending ? ' · ' + pending.toLocaleString('en-ZA') + ' pending on orders in progress' : '') + '</p>'
      + (earned === 0 && pending === 0 ? '<p class="sm max-46 mt-4" style="color:rgb(255 255 255 / .7)">Nothing yet. Points post when an order reaches its last step, so place one and watch it land here.</p>' : '')
    + '</div>'
    + '<section class="mt-10"><h2 class="display h-md">Spend them on</h2>'
      + '<ul class="grid grid-4 mt-4">' + REWARDS.map((r) => {
          const reached = earned >= r.points;
          const pct = Math.min(100, Math.round((earned / r.points) * 100));
          return '<li class="panel" style="' + (reached ? 'border-color:var(--red)' : '') + '">'
            + '<h3 class="sm bb">' + esc(r.name) + '</h3>'
            + '<p class="sm b red num mt-1">' + r.points.toLocaleString('en-ZA') + ' points</p>'
            + '<div class="bar mt-3" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100" aria-label="Progress towards ' + esc(r.name) + '"><span style="width:' + pct + '%"></span></div>'
            + '<p class="xs muted mt-2">' + (reached ? 'Ready to redeem in store' : (r.points - earned).toLocaleString('en-ZA') + ' points to go') + '</p>'
            + '</li>';
        }).join('') + '</ul></section>'
    + '<section class="mt-12"><h2 class="display h-md">Tiers</h2>'
      + '<ul class="grid grid-3 mt-4">' + TIERS.map((t) =>
          '<li class="panel"><h3 class="display h-sm red">' + t.name + '</h3>'
          + '<p class="sm b num mt-1">' + t.from.toLocaleString('en-ZA') + ' points</p>'
          + '<p class="xs muted mt-2">' + (t.from === 0 ? 'Where every account starts.' : 'Reached at ' + t.from.toLocaleString('en-ZA') + ' lifetime points.') + '</p></li>').join('')
      + '</ul></section>'
    + '<div class="panel mt-10">' + demoNotice() + '</div>'
    + '<div class="mt-8"><a class="btn btn-red" href="#/menu">Start earning</a></div>'
    + '</div>';
}

    + '<div class="grid" style="grid-template-columns:1fr;gap:40px;align-items:center" id="app-grid">'
      + '<div>'
        + '<p class="eyebrow">Coming to the stores</p>'
        + '<h1 class="display h-lg mt-2">The same crunch,<br>in your pocket</h1>'
        + '<p class="sm muted mt-4 max-46" style="line-height:1.7">The app carries the same menu, the same basket and the same live order tracking as this site, with saved addresses and points on the home screen.</p>'
        + '<p class="craft" style="color:var(--red)">' + esc(CRAFT_LINE) + '</p>'
        + '<div class="mt-7"><a class="btn btn-red" href="#/menu">Order on the web meanwhile</a></div>'
      + '</div>'
      + '<div class="grid grid-3" style="gap:32px">'
        + frame(screenHome, 'Home') + frame(screenProduct, 'Product') + frame(screenTrack, 'Order tracking')
      + '</div>'
    + '</div></div>';
}

/* ---------- Checkout ---------- */

const STEPS = ['Fulfilment','Details','Where to','Pay'];

function viewCheckout(){
  if(S.lines.length === 0){
    return '<div class="wrap" style="padding:40px 20px"><h1 class="display h-lg">Checkout</h1>'
      + '<div class="panel center mt-8" style="padding:40px">'
      + '<p class="display h-md" style="color:var(--black-60)">Your basket is empty</p>'
      + '<p class="sm muted mt-2">Add something before checking out.</p>'
      + '<div class="mt-5"><a class="btn btn-red" href="#/menu">Browse the menu</a></div></div></div>';
  }

  const c = S.checkout;
  const s = store();
  const svc = services(s);

  const steps = STEPS.map((label, i) =>
    '<li><span class="pill ' + (i === c.step ? 'now' : (i < c.step ? 'done' : '')) + '"' + (i === c.step ? ' aria-current="step"' : '') + '>'
    + '<span class="num">' + (i + 1) + '</span> ' + label + '</span>'
    + (i < STEPS.length - 1 ? '<span class="sep" aria-hidden="true"></span>' : '') + '</li>').join('');

  let body = '';

  if(c.step === 0){
    body = '<section><h2 class="display h-md">How would you like it?</h2>'
      + '<div class="grid grid-3 mt-4">' + ['Delivery','Collection','Dine-in'].map((mode) => {
          const sub = svc[mode]
            ? (mode === 'Delivery' ? 'To your door' : (mode === 'Collection' ? 'Ready at the counter' : 'A table in store'))
            : 'Not available here';
          return '<button type="button" class="pick" data-action="mode" data-value="' + mode + '" aria-pressed="' + (S.mode === mode) + '"' + (svc[mode] ? '' : ' disabled') + '>'
            + '<span class="nm">' + mode + '</span><span class="sub">' + sub + '</span></button>';
        }).join('') + '</div>'
      + '<h3 class="xxs b muted mt-8" style="letter-spacing:.08em;text-transform:uppercase">Which store</h3>'
      + '<div class="grid grid-2 mt-3">' + STORES.map((st) =>
          '<button type="button" class="pick" data-action="pick-store" data-value="' + st.id + '" aria-pressed="' + (S.storeId === st.id) + '">'
          + '<span class="nm">' + esc(st.name) + '</span><span class="sub">' + esc(st.address) + '</span>'
          + (services(st)['Dine-in'] ? '' : '<span class="sub red b mt-2">No dine-in at this store</span>') + '</button>').join('')
      + '</div></section>';
  }

  if(c.step === 1){
    const field = (key, label, type, hint, extra) =>
      '<label class="field' + (extra || '') + '"><span class="lbl">' + label + '</span>'
      + '<input type="' + type + '" value="' + esc(c[key]) + '" data-action="field" data-key="' + key + '"'
      + (c.errors[key] ? ' aria-invalid="true"' : '') + ' autocomplete="' + (key === 'name' ? 'name' : key === 'email' ? 'email' : 'tel') + '">'
      + (c.errors[key] ? '<p class="err" role="alert">' + esc(c.errors[key]) + '</p>' : (hint ? '<p class="hint">' + hint + '</p>' : ''))
      + '</label>';

    body = '<section><h2 class="display h-md">Your details</h2>'
      + '<div class="grid grid-2 mt-4">'
        + '<div style="grid-column:1/-1">' + field('name', 'Name', 'text', '') + '</div>'
        + field('email', 'Email', 'email', 'Your receipt and order updates go here.')
        + field('mobile', 'Mobile', 'tel', 'The driver or the store calls this number.')
      + '</div></section>';
  }

  if(c.step === 2){
    body = '<section><h2 class="display h-md">' + (S.mode === 'Delivery' ? 'Where are we taking it?' : 'Anything for the kitchen?') + '</h2>'
      + (S.mode === 'Delivery'
          ? '<div class="grid grid-2 mt-4">'
            + '<label class="field" style="grid-column:1/-1"><span class="lbl">Street address</span>'
              + '<input type="text" value="' + esc(c.address) + '" data-action="field" data-key="address" autocomplete="street-address"' + (c.errors.address ? ' aria-invalid="true"' : '') + '>'
              + (c.errors.address ? '<p class="err" role="alert">' + esc(c.errors.address) + '</p>' : '') + '</label>'
            + '<label class="field"><span class="lbl">Suburb</span>'
              + '<input type="text" value="' + esc(c.suburb) + '" data-action="field" data-key="suburb" autocomplete="address-level2"' + (c.errors.suburb ? ' aria-invalid="true"' : '') + '>'
              + (c.errors.suburb ? '<p class="err" role="alert">' + esc(c.errors.suburb) + '</p>'
                  : '<p class="hint">' + esc(s.name) + ' delivers to ' + s.zones.slice(0, 3).join(', ') + ' and more.</p>') + '</label>'
            + (c.quote && c.quote.serviceable
                ? '<p class="ok-note" style="align-self:end">We deliver there. About ' + c.quote.eta + ' minutes.</p>' : '')
          + '</div>'
          : '<p class="sm muted mt-3 max-56">' + (S.mode === 'Collection'
              ? 'Collect from ' + esc(s.name) + ', ' + esc(s.address) + '.'
              : 'A table at ' + esc(s.name) + ', ' + esc(s.address) + '.') + '</p>')
      + '<label class="field mt-5"><span class="lbl">Note for the kitchen</span>'
        + '<textarea rows="3" data-action="field" data-key="note" maxlength="280">' + esc(c.note) + '</textarea>'
        + '<p class="hint">' + c.note.length + ' of 280 characters. Allergies go here, and the store will call if it cannot be met.</p></label>'
      + '</section>';
  }

  if(c.step === 3){
    body = '<section><h2 class="display h-md">Payment</h2>'
      + '<div class="notice mt-4"><p class="sm bb">No payment provider is configured</p>'
        + '<p class="sm muted mt-2 max-56" style="line-height:1.7">A provider has not been selected and no merchant credentials exist, so nothing is charged. Placing the order below records it and starts the kitchen journey, exactly as it will once payment is wired in.</p>'
        + '<p class="mt-3">' + flag('Not live') + '</p></div>'
      + '</section>';
  }

  const controls = '<div class="row-wrap mt-8">'
    + (c.step > 0 ? '<button type="button" class="btn btn-ghost" data-action="back">Back</button>' : '')
    + (c.step < STEPS.length - 1
        ? '<button type="button" class="btn btn-red" data-action="next">Continue</button>'
        : '<button type="button" class="btn btn-red" data-action="place">Place order <span aria-hidden="true" style="opacity:.7">·</span> <span class="num">' + money(grandTotal()) + '</span></button>')
    + '</div>';

  return '<div class="wrap" style="padding:40px 20px">'
    + '<h1 class="display h-lg">Checkout</h1>'
    + '<div class="grid mt-8" style="grid-template-columns:1fr;gap:40px" id="checkout-grid">'
      + '<div><ol class="steps" aria-label="Checkout progress">' + steps + '</ol>' + body + controls + '</div>'
      + '<aside><div class="panel">'
        + '<h2 class="display h-sm">Your order</h2>'
        + '<p class="xs muted mt-1">' + S.mode + ' from ' + esc(s.name) + '</p>'
        + '<ul class="mt-4" style="border-top:1px solid var(--line);border-bottom:1px solid var(--line)">'
          + S.lines.map((l) => '<li class="line" style="padding:12px 0">'
            + '<span class="shot" style="width:48px;height:48px"><img src="' + IMG[l.img] + '" alt=""></span>'
            + '<span class="info"><span class="xs b" style="display:block"><span class="num">' + l.qty + '×</span> ' + esc(l.name) + '</span>'
            + (l.options.length ? '<span class="xxs muted" style="display:block;margin-top:2px;line-height:1.4">' + esc(describeOptions(l.options)) + '</span>' : '')
            + '</span><span class="xs b num">' + money(l.unitCents * l.qty) + '</span></li>').join('')
        + '</ul>'
        + totalsBlock()
      + '</div></aside>'
    + '</div></div>';
}

function totalsBlock(){
  const d = discount();
  const fee = deliveryFee();
  return '<dl class="totals mt-4">'
    + '<div class="row"><dt>Subtotal</dt><dd class="num">' + money(subtotal()) + '</dd></div>'
    + (d > 0 ? '<div class="row discount"><dt style="color:inherit">Discount' + (S.promoCode ? ' (' + S.promoCode + ')' : '') + '</dt><dd class="num">−' + money(d) + '</dd></div>' : '')
    + (S.mode === 'Delivery' ? '<div class="row"><dt>Delivery ' + flag() + '</dt><dd class="num">'
        + (fee === 0 ? '<span class="b red">Free</span>' : money(fee)) + '</dd></div>' : '')
    + '<div class="row grand"><dt>Total</dt><dd class="num">' + money(grandTotal()) + '</dd></div>'
    + '</dl>';
}

/* ---------- Journey ---------- */

function viewJourney(){
  const order = S.orders.find((o) => o.id === S.trackedId) || S.orders[0];
  if(!order){
    return '<div class="wrap" style="padding:40px 20px">'
      + '<p class="eyebrow">Live</p><h1 class="display h-lg mt-2">My journey</h1>'
      + '<div class="panel center mt-8" style="padding:40px">'
      + '<p class="display h-md" style="color:var(--black-60)">No order to follow</p>'
      + '<p class="sm muted mt-2">Place an order and its progress appears here, step by step.</p>'
      + '<div class="mt-5"><a class="btn btn-red" href="#/menu">Browse the menu</a></div></div></div>';
  }

  const states = statesFor(order.mode);
  const at = order.status === 'cancelled' ? -1 : states.indexOf(order.status);
  const done = order.status === 'completed' || order.status === 'cancelled';

  const timeline = states.map((state, i) => {
    const isDone = i < at, isNow = i === at;
    return '<li><span class="mark">'
      + '<span class="bead' + (isDone || isNow ? ' on' : '') + '" aria-hidden="true">' + (isDone ? '✓' : i + 1) + '</span>'
      + (i < states.length - 1 ? '<span class="stem' + (i < at ? ' on' : '') + '"></span>' : '')
      + '</span><span class="txt">'
      + '<span class="lbl ' + (isNow ? 'now' : (isDone ? 'done' : '')) + '" style="display:block">' + stateLabel(state, order.mode)
        + (isNow ? '<span class="sr"> — current step</span>' : '') + '</span>'
      + (isDone || isNow ? '<span class="msg" style="display:block">' + STATE_MSG[state] + '</span>' : '')
      + '</span></li>';
  }).join('');

  return '<div class="wrap" style="padding:40px 20px">'
    + '<p class="eyebrow">Live</p><h1 class="display h-lg mt-2">My journey</h1>'
    + '<div class="grid mt-8" style="grid-template-columns:1fr;gap:40px" id="journey-grid">'
      + '<div><div class="panel">'
        + '<div class="between"><div>'
          + '<p class="xxs b muted" style="letter-spacing:.08em;text-transform:uppercase">Order number</p>'
          + '<p class="display num mt-1" style="font-size:30px">' + order.orderNumber + '</p></div>'
          + '<span class="badge badge-red">' + (order.status === 'cancelled' ? 'Cancelled'
              : order.status === 'completed' ? completedLabel(order.mode) : order.mode) + '</span></div>'
        + (order.cancelledReason ? '<p class="sm mt-4" style="background:var(--red-10);color:var(--red);border-radius:var(--r-sm);padding:12px 16px">Cancelled: ' + esc(order.cancelledReason) + '</p>' : '')
        + '<ol class="timeline mt-7">' + timeline + '</ol>'
        + (done ? '' : '<p class="xs muted mt-2">Estimated ' + order.eta + ' minutes from when the order was placed.</p>')
      + '</div>'
      + '<div class="row-wrap mt-6">'
        + '<button type="button" class="btn btn-red" data-action="reorder" data-value="' + order.id + '">Order this again</button>'
        + '<a class="btn btn-ghost" href="#/menu">Add something else</a>'
        + (done ? '' : '<button type="button" class="btn btn-ghost" data-action="advance" data-value="' + order.id + '">Move to next step ' + flag() + '</button>')
      + '</div></div>'
      + '<aside><div class="panel">'
        + '<h2 class="display h-sm">What you ordered</h2>'
        + '<ul class="mt-4" style="border-top:1px solid var(--line);border-bottom:1px solid var(--line)">'
          + order.lines.map((l) => '<li class="line" style="padding:12px 0">'
            + '<span class="shot" style="width:48px;height:48px"><img src="' + IMG[l.img] + '" alt=""></span>'
            + '<span class="info"><span class="xs b" style="display:block"><span class="num">' + l.qty + '×</span> ' + esc(l.name) + '</span>'
            + (l.options.length ? '<span class="xxs muted" style="display:block;margin-top:2px;line-height:1.4">' + esc(describeOptions(l.options)) + '</span>' : '')
            + '</span><span class="xs b num">' + money(l.unitCents * l.qty) + '</span></li>').join('')
        + '</ul>'
        + '<div class="row between mt-4" style="font-size:16px;font-weight:800"><span>Total</span><span class="num">' + money(order.totals.totalCents) + '</span></div>'
        + (order.note ? '<div class="mt-4" style="background:var(--paper);border-radius:var(--r-sm);padding:12px">'
            + '<p class="xxs b muted" style="letter-spacing:.08em;text-transform:uppercase">Note for the kitchen</p>'
            + '<p class="xs mt-1">' + esc(order.note) + '</p></div>' : '')
        + '<p class="xs muted mt-4">Earning <span class="b red num">' + order.points.toLocaleString('en-ZA') + '</span> points on this order.</p>'
      + '</div></aside>'
    + '</div></div>';
}

/* ---------- Operations console ---------- */

function viewAdmin(){

              + '<div class="between"><div><p class="sm bb num">' + o.orderNumber + '</p>'

            + '<td><label><span class="sr">Hide ' + esc(p.name) + ' from the menu</span>'
              + '<input type="checkbox" data-action="hide" data-value="' + p.slug + '"' + (isHidden(p.slug) ? ' checked' : '') + '></label></td></tr>').join('')
        + '</tbody></table></div>';
  }

  if(S.adminTab === 'Stores'){
    panel = '<h2 class="display h-md">Service switches</h2>'
      + '<ul class="grid grid-2 mt-4">' + STORES.map((s) => {
          const svc = services(s);

            + '<p class="xs muted mt-1">' + esc(s.address) + '</p>'
            + '<ul class="stack gap-2 mt-4">' + ['Delivery','Collection','Dine-in'].map((m) =>
                '<li class="between" style="align-items:center"><span class="sm b">' + m + '</span>'
                + '<label><span class="sr">' + m + ' at ' + esc(s.name) + '</span>'
                + '<input type="checkbox" data-action="service" data-store="' + s.id + '" data-value="' + m + '"' + (svc[m] ? ' checked' : '') + '></label></li>').join('')
            + '</ul></li>';

    panel = '<h2 class="display h-md">Promotions</h2>'

          '<li class="panel between" style="align-items:center">'
          + '<div><p class="sm bb">' + esc(o.title) + '</p><p class="xs muted mt-1">' + esc(o.valid) + '</p></div>'
          + '<div class="row gap-4"><code style="background:var(--red-10);color:var(--red);border-radius:var(--r-xs);padding:4px 10px;font-size:12px;font-weight:800">' + o.code + '</code>'
