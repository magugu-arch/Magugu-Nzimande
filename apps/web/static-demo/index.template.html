          + '<span class="who">' + esc(e.who) + '</span><span>' + esc(e.what) + '</span></li>').join('') + '</ol>';
  }

  return '<div class="wrap" style="padding:40px 20px">'
    + '<h1 class="display h-lg">Operations</h1>'
    + '<div class="notice mt-4 max-62"><p class="sm" style="line-height:1.7"><span class="bb">Open in this review build only.</span> '
      + 'On the real site this console sits behind an operator passphrase and every write endpoint refuses without a signed session. '
      + 'This build has no server to sign in to, so it is left open to walk through &mdash; which is also why it is loaded with sample data and cannot reach a real store.</p></div>'
    + '<div class="tabs mt-8" role="tablist" aria-label="Operations sections">' + tabs + '</div>'
    + '<div class="mt-6" role="tabpanel" aria-label="' + S.adminTab + '">' + panel + '</div>'
    + '</div>';
}

/* ---------- Basket drawer ---------- */

function viewDrawer(){
  const count = itemCount();
  const head = '<div class="drawer-head"><h2 class="display h-md">Your basket</h2>'
    + '<button type="button" class="icon-btn" data-action="close-drawer" aria-label="Close basket" style="width:36px;height:36px">'
    + '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="m5.3 4 10.7 10.7-1.3 1.3L4 5.3 5.3 4Zm10.7 1.3L5.3 16 4 14.7 14.7 4 16 5.3Z"/></svg></button></div>';

  if(count === 0){
    return head + '<div class="empty"><p class="display h-md" style="color:var(--black-60)">Nothing in here yet</p>'
      + '<p class="sm muted">Twice fried in olive oil. Tossed to order. Start with a whole bird.</p>'
      + '<a class="btn btn-red" href="#/menu" data-action="close-drawer">Browse the menu</a></div>';
  }

  const remaining = remainingToFree();
  const pct = Math.min(100, Math.round(((subtotal() - discount()) / FEES.freeOverCents) * 100));

  const meter = S.mode === 'Delivery'
    ? '<div class="meter"><p class="xs b row" style="gap:8px">'
      + (remaining === 0 ? '<span class="red">Delivery is on us.</span>'
          : '<span><span class="b red num">' + moneyShort(remaining) + '</span> more for free delivery</span>')
      + flag() + '</p>'
      + '<div class="bar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100" aria-label="Progress towards free delivery"><span style="width:' + pct + '%"></span></div></div>'
    : '';

  const lines = S.lines.map((l) => '<li class="line">'
    + '<span class="shot"><img src="' + IMG[l.img] + '" alt=""></span>'
    + '<span class="info"><span class="nm">' + esc(l.name) + '</span>'
      + (l.options.length ? '<span class="opt">' + esc(describeOptions(l.options)) + '</span>' : '')
      + '<span class="row"><span class="stepper">'
        + '<button type="button" data-action="qty" data-key="' + esc(l.key) + '" data-value="' + (l.qty - 1) + '" aria-label="' + (l.qty === 1 ? 'Remove ' : 'One fewer ') + esc(l.name) + '">'
        + (l.qty === 1 ? '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M6 2h4v1H6V2ZM3 4h10v1.4h-1l-.7 8.2A1.4 1.4 0 0 1 9.9 15H6.1a1.4 1.4 0 0 1-1.4-1.4L4 5.4H3V4Z"/></svg>' : '−') + '</button>'
        + '<span class="qty num" aria-hidden="true">' + l.qty + '</span>'
        + '<button type="button" data-action="qty" data-key="' + esc(l.key) + '" data-value="' + (l.qty + 1) + '" aria-label="One more ' + esc(l.name) + '">+</button>'
      + '</span><span class="sm b num" style="margin-left:auto">' + money(l.unitCents * l.qty) + '</span></span>'
    + '</span></li>').join('');

  const inBasket = S.lines.map((l) => l.slug);
  const suggestions = catalogue().filter((p) => p.category === 'Sides' && !inBasket.includes(p.slug) && !isSoldOut(p.slug)).slice(0, 4);

  const suggest = suggestions.length
    ? '<section style="border-top:1px solid var(--line);padding:16px 0">'
      + '<h3 class="xxs b muted" style="letter-spacing:.1em;text-transform:uppercase">Goes well with</h3>'
      + '<div class="suggest">' + suggestions.map((p) =>
          '<button type="button" data-action="quick-add" data-value="' + p.slug + '">'
          + '<span class="shot"><img src="' + IMG[p.img] + '" alt="" loading="lazy"></span>'
          + '<span class="nm">' + esc(p.name) + '</span><span class="pr num">' + moneyShort(p.priceCents) + '</span></button>').join('')
      + '</div></section>'
    : '';

  const promo = S.promoCode
    ? '<div class="between" style="align-items:center;background:var(--red-10);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:12px">'
      + '<span class="sm b red">' + S.promoCode + ' applied</span>'
      + '<button type="button" class="xs b muted" style="text-decoration:underline" data-action="clear-promo">Remove</button></div>'
    : '<div class="row gap-2" style="margin-bottom:12px">'
      + '<label class="flex-1"><span class="sr">Promo code</span>'
        + '<input type="text" id="promo" placeholder="Promo code" style="width:100%;height:40px;border:1px solid var(--line);border-radius:var(--pill);padding:0 16px;font-size:14px;text-transform:uppercase"></label>'
      + '<button type="button" class="btn btn-ghost btn-sm" data-action="promo">Apply</button></div>';

  return head
    + '<div class="drawer-body">' + meter + '<ul>' + lines + '</ul>' + suggest + '</div>'
    + '<div class="drawer-foot">' + promo + totalsBlock()
      + '<a class="btn btn-red btn-block mt-3" href="#/checkout" data-action="close-drawer">Checkout</a></div>';
}

function viewSticky(){
  const count = itemCount();
  if(count === 0 || S.drawerOpen || S.route === '/checkout') return '';
  return '<div class="sticky-bar"><button type="button" data-action="open-drawer">'
    + '<span>View basket (' + count + ')</span><span class="num">' + money(grandTotal()) + '</span></button></div>';
}
</script>

<script>
/* ============================================================
   Router, rendering and events.
   ============================================================ */

const VIEWS = {
  '/':viewHome, '/menu':viewMenu, '/offers':viewOffers, '/rewards':viewRewards,
  '/stores':viewStores, '/help':viewHelp, '/app':viewApp, '/checkout':viewCheckout,
  '/journey':viewJourney, '/account':viewAccount, '/admin':viewAdmin,
};

const TITLES = {
  '/':'bb.q Chicken South Africa', '/menu':'Menu', '/offers':'Offers', '/rewards':'Rewards',
  '/stores':'Find a store', '/help':'Help and allergens', '/app':'The app',
  '/checkout':'Checkout', '/journey':'My journey', '/account':'Account', '/admin':'Operations console',
};

function parseRoute(){
  const raw = (location.hash || '#/').slice(1);
  const [path, query] = raw.split('?');
  if(query){
    const category = new URLSearchParams(query).get('category');
    if(category && CATEGORIES.some((c) => c.key === category)) S.menu.category = category;
  }
  return path || '/';
}

function go(path){
  location.hash = '#' + path;
}

/**
 * Layouts that need two columns above a breakpoint. Done here rather than in
 * the stylesheet because each grid has its own ratio and the markup is built
 * as strings.
 */
const COLUMNS = {
  'menu-grid':'210px 1fr', 'product-grid':'1fr 1fr', 'checkout-grid':'1.2fr 0.8fr',
  'journey-grid':'1.1fr 0.9fr', 'account-grid':'1.3fr 0.7fr', 'help-grid':'1.1fr 0.9fr',
  'app-grid':'0.9fr 1.1fr',
};

function applyColumns(){
  const wide = window.matchMedia('(min-width: 1024px)').matches;
  for(const id in COLUMNS){
    const node = document.getElementById(id);
    if(node) node.style.gridTemplateColumns = wide ? COLUMNS[id] : '1fr';
  }
  const side = document.getElementById('menu-side');
  if(side) side.style.display = wide ? 'block' : 'none';
  const chips = document.getElementById('menu-chips');
  if(chips) chips.style.display = wide ? 'none' : 'flex';
}

let painting = false;

function render(){
  if(painting) return;
  painting = true;

  const view = VIEWS[S.route] || (S.route.indexOf('/menu/') === 0
    ? () => viewProduct(S.route.slice('/menu/'.length))
    : viewHome);

  $('chrome').innerHTML = viewChrome();
  $('main').innerHTML = view();
  $('footer').innerHTML = viewFooter();
  $('drawer').innerHTML = viewDrawer();
  $('sticky').innerHTML = viewSticky();

  $('drawer').classList.toggle('open', S.drawerOpen);
  $('scrim').classList.toggle('open', S.drawerOpen);
  $('drawer').setAttribute('aria-hidden', String(!S.drawerOpen));
  /* inert takes the closed panel out of the tab order and the accessibility
     tree. Without it a keyboard user tabs off the page and into a basket that
     is sitting off-screen, hitting controls nothing announces. */
  $('drawer').inert = !S.drawerOpen;
  document.body.style.overflow = S.drawerOpen ? 'hidden' : '';

  const name = S.route.indexOf('/menu/') === 0
    ? (product(S.route.slice('/menu/'.length)) || {}).name
    : TITLES[S.route];
  document.title = S.route === '/' ? TITLES['/'] : (name || 'bb.q Chicken') + ' | bb.q Chicken South Africa';

  applyColumns();
  painting = false;
}

/* ---------- Focus trap ---------- */

const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
/**
 * Held as a selector rather than a node: closing repaints the header, so the
 * element that opened the drawer no longer exists by the time focus goes back
 * to it.
 */
let returnFocusTo = null;

function openDrawer(){
  const active = document.activeElement;
  returnFocusTo = active && active.dataset && active.dataset.action
    ? '[data-action="' + active.dataset.action + '"]'
    : null;
  S.drawerOpen = true;
  render();
  const first = $('drawer').querySelector(FOCUSABLE);
  if(first) first.focus();
}

function closeDrawer(){
  if(!S.drawerOpen) return;
  S.drawerOpen = false;
  render();
  if(returnFocusTo){
    const target = Array.prototype.find.call(
      document.querySelectorAll(returnFocusTo), (el) => el.offsetParent !== null);
    if(target) target.focus();
  }
  returnFocusTo = null;
}

document.addEventListener('keydown', (event) => {
  if(!S.drawerOpen) return;
  if(event.key === 'Escape'){ event.preventDefault(); closeDrawer(); return; }
  if(event.key !== 'Tab') return;

  const items = Array.prototype.filter.call(
    $('drawer').querySelectorAll(FOCUSABLE), (el) => el.offsetParent !== null);
  if(items.length === 0) return;
  const first = items[0], last = items[items.length - 1];

  if(event.shiftKey && document.activeElement === first){ event.preventDefault(); last.focus(); }
  else if(!event.shiftKey && document.activeElement === last){ event.preventDefault(); first.focus(); }
});

/* ---------- Delegated events ---------- */

document.addEventListener('click', (event) => {
  const node = event.target.closest('[data-action]');
  if(!node) return;
  const action = node.dataset.action;
  const value = node.dataset.value;

  /* Inputs and selects are handled on change, not click. */
  if(node.tagName === 'INPUT' || node.tagName === 'SELECT') return;

  switch(action){
    case 'open-drawer': openDrawer(); return;
    case 'close-drawer': closeDrawer(); return;
    case 'toggle-menu': S.menuOpen = !S.menuOpen; render(); return;
    case 'close-menu': S.menuOpen = false; return;

    case 'mode': setMode(value); return;
    case 'pick-store': setStore(value); return;

    case 'category': S.menu.category = value; render(); return;
    case 'clear-filters': S.menu = {search:'', category:'all', heatMax:5, sort:'popular'}; render(); return;

    case 'option': {
      const p = product(S.product.slug);
      const groups = optionGroups(p);
      const group = groups.find((g) => g.key === node.dataset.group);
      S.product.sel = chooseOption(groups, S.product.sel, group, value);
      render();
      return;
    }
    case 'pqty': {
      S.product.qty = Math.max(1, S.product.qty + Number(value));
      render();
      return;
    }
    case 'add': {
      const p = product(S.product.slug);
      const groups = optionGroups(p);
      const price = unitPrice(p.priceCents, groups, S.product.sel);
      addLine(p, selectedOptions(groups, S.product.sel), S.product.qty, price);
      openDrawer();
      return;
    }
    case 'quick-add': {
      const p = product(value);
      addLine(p, [], 1, p.priceCents);
      render();
      return;
    }
    case 'qty': setQty(node.dataset.key, Number(value)); return;
    case 'promo': {
      const input = $('promo');
      if(input) applyPromo(input.value);
      return;
    }
    case 'clear-promo': S.promoCode = null; save(); render(); return;

    case 'back': S.checkout.step -= 1; S.checkout.errors = {}; render(); return;
    case 'next': {
      const c = S.checkout;
      if(c.step === 1 && !validateDetails()){ render(); return; }
      if(c.step === 2 && !validateWhere()){ render(); return; }
      c.step = Math.min(STEPS.length - 1, c.step + 1);
      render();
      return;
    }
    case 'place': placeOrder(); return;

    case 'advance': advanceOrder(value); return;
    case 'reorder': {
      const order = S.orders.find((o) => o.id === value);
      if(order) reorder(order);
      return;
    }
    case 'track': S.trackedId = value; go('/journey'); return;

    case 'tab': S.adminTab = value; render(); return;
    case 'set-status': setOrderStatus(node.dataset.order, value); return;
  }
});

document.addEventListener('change', (event) => {
  const node = event.target.closest('[data-action]');
  if(!node) return;
  const action = node.dataset.action;
  const value = node.dataset.value;

  switch(action){
    case 'store': setStore(node.value); return;
    case 'sort': S.menu.sort = node.value; render(); return;
    case 'heat': S.menu.heatMax = Number(node.value); render(); return;

    case 'sold-out': {
      const p = product(value);
      S.soldOut = node.checked ? S.soldOut.concat([value]) : S.soldOut.filter((s) => s !== value);
      audit('operations', p.name + ' marked ' + (node.checked ? 'sold out' : 'available'));
      render();
      return;
    }
    case 'hide': {
      const p = product(value);
      S.hidden = node.checked ? S.hidden.concat([value]) : S.hidden.filter((s) => s !== value);
      audit('operations', p.name + (node.checked ? ' hidden from' : ' restored to') + ' the menu');
      render();
      return;
    }
    case 'service': {
      const id = node.dataset.store;
      const target = STORES.find((s) => s.id === id);
      S.serviceOverrides[id] = Object.assign({}, S.serviceOverrides[id]);
      S.serviceOverrides[id][value] = node.checked;
      audit('operations', target.name + ': ' + value + ' switched ' + (node.checked ? 'on' : 'off'));
      /* A service the customer is mid-order on must not stay selected. */
      if(id === S.storeId && !node.checked && S.mode === value) S.mode = 'Collection';
      save();
      render();
      return;
    }
  }
});

/* Typed fields repaint on input, so the search and the checkout stay live
   without losing the caret. */
document.addEventListener('input', (event) => {
  const node = event.target.closest('[data-action]');
  if(!node) return;

  if(node.dataset.action === 'search'){
    S.menu.search = node.value;
    const at = node.selectionStart;
    render();
    const again = $('menu-search');
    if(again){ again.focus(); again.setSelectionRange(at, at); }
    return;
  }

  if(node.dataset.action === 'field'){
    const key = node.dataset.key;
    S.checkout[key] = node.value;
    if(key === 'suburb') S.checkout.quote = null;
    /* Only the note repaints, for its counter; the rest would fight the caret. */
    if(key === 'note'){
      const at = node.selectionStart;
      render();
      const again = document.querySelector('[data-key="note"]');
      if(again){ again.focus(); again.setSelectionRange(at, at); }
    }
  }
});

document.addEventListener('keydown', (event) => {
  if(event.key === 'Enter' && event.target.id === 'promo'){
    event.preventDefault();
    applyPromo(event.target.value);
  }
});

window.addEventListener('hashchange', () => {
  S.route = parseRoute();
  S.menuOpen = false;
  if(S.drawerOpen) closeDrawer();
  window.scrollTo(0, 0);
  render();
});

window.addEventListener('resize', applyColumns);

/* ---------- Announcement strip ----------
   Held still for anyone who has asked for reduced motion: a strip that
   changes under you is the movement the setting exists to stop. */

const MESSAGES = [
  CRAFT_LINE,
  'Delivery, collection and dine-in across Johannesburg.',
  'Half and Half: two sauces on one bird.',
];

function startTicker(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let index = 0;
  setInterval(() => {
    const node = $('tick');
    if(!node) return;
    node.classList.add('fade');
    setTimeout(() => {
      index = (index + 1) % MESSAGES.length;
      node.textContent = MESSAGES[index];
      node.classList.remove('fade');
    }, 300);
  }, 5000);
}

/* ---------- The kitchen ----------
   An order moves itself along every twenty seconds, standing in for the
   kitchen display system the production build polls, so the five states can be
   watched end to end. The manual control on the journey screen stays, for
   walking someone through it at their own pace. */

const KITCHEN_TICK_MS = 20000;

function startKitchen(){
  setInterval(() => {
    const tracked = S.orders.find((o) => o.id === S.trackedId) || S.orders[0];
    if(!tracked) return;
    const order = stepOrder(tracked.id);
    if(!order) return;

    /* Repainted only where the change is on screen. A repaint under someone
       part-way through checkout would take their caret with it. */
    if(S.route === '/journey' || S.route === '/admin'){
      announce('Order status: ' + stateLabel(order.status, order.mode) + '.');
      render();
    }
  }, KITCHEN_TICK_MS);
}

/* ---------- Boot ---------- */

load();
S.route = parseRoute();
render();
startTicker();
startKitchen();
</script>
