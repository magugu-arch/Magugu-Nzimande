name: Quest4Best website

on:
  push:
    branches: ['claude/website-creation-pending-tw5fmz']
    paths: ['quest4best/**', '.github/workflows/quest4best-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half-way; let the newest one queue behind it.
concurrency:
  group: quest4best-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: quest4best
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quest4best/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # Pages serves the site under /<repo>/, so the build needs that base and
      # the matching public URL for canonical, Open Graph and the sitemap.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Optional: Settings → Secrets and variables → Actions → Variables.
          # Unset, the request form falls back to the visitor's mail app.
          VITE_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          # Search Console / Bing ownership codes (the content="…" value only).
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quest4best/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
