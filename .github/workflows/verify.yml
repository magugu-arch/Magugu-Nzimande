name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the lockfile, so CI cannot drift from local.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Formatting is not enforced by eslint here, so it drifted unnoticed
      # across several files before this was added.
      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test -- --ci

      # Metro compiling is the last thing that can fail before a build server
      # is involved, so it is worth catching here rather than 15 minutes into
      # an EAS build.
      - name: Bundle for both platforms
        run: |
          npx expo export --platform ios --output-dir /tmp/export-ios
          npx expo export --platform android --output-dir /tmp/export-android

      # app.json is not the whole story: config plugins add Info.plist keys and
      # manifest permissions of their own, and the defaults they add are the
      # ones that get an app rejected. This runs a real prebuild and reads what
      # actually came out — Pillow is for the app-icon alpha check.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install --quiet 'pillow==12.3.0'

      - name: Audit the native projects
        run: npm run audit:native

  # Rendering the app catches what unit tests structurally cannot: overflow,
  # clipped labels, a screen that renders blank, a journey that no longer
  # connects. Kept out of `npm run verify` because a browser sweep is minutes,
  # not seconds, and a pre-commit gate should be seconds.
  screens:
    name: Render every screen, and place an order
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # All 26 routes at 390pt and 320pt: overflow, blank screens, console
      # errors, and §32.6 — accessible names and visible focus rings.
      - name: Sweep the screens
        run: npm run audit:screens

      # The one journey the app exists for, end to end against the mock layer.
      - name: Place an order
        run: npm run smoke:order

      # Every screen with the mock off and a host that does not answer. Eleven
      # of fourteen screens once claimed something false rather than admitting
      # they could not reach the server — "No offers right now", "No orders on
      # the go" — so an empty state now has to be earned by a fetch that
      # actually succeeded.
      - name: Check what the screens say with no server
        run: npm run audit:offline

      # The account the seeded data could never represent: somebody who
      # installed the app this morning. Nothing saved, nothing ordered. It has
      # already caught a customer with no card being offered no way to pay at
      # all, cash included.
      - name: Order as a brand-new customer
        run: npm run audit:coldstart

  assets:
    name: Food asset catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The type-fit audit measures the bundled Montserrat TTF, so this job
      # needs node_modules as well as Pillow.
      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned: JPEG encoding is deterministic within a Pillow version but can
      # shift between them, which would fail the drift check below spuriously.
      - name: Install Pillow
        run: pip install --quiet 'pillow==12.3.0'

      # Fails while any of the 16 products lacks its own photograph, so a new
      # menu item cannot ship on a placeholder unnoticed.
      - name: Audit supplied artwork
        run: npm run assets:audit

      # Derivatives are generated, so they must match their masters. A drifted
      # crop means someone edited a derivative by hand instead of the source.
      - name: Check derivatives are up to date
        run: |
          npm run assets:derive
          if ! git diff --quiet -- assets/food src/constants/foodAssetRegistry.ts; then
            echo "::error::Derivatives are stale. Run 'npm run assets:derive' and commit the result."
            git --no-pager diff --stat -- assets/food src/constants/foodAssetRegistry.ts
            exit 1
          fi

      # Montserrat runs ~30% wider than the Helvetica metrics it replaced once
      # §22.7's uppercase CTAs are applied, and React Native truncates rather
      # than complaining. Measured off the bundled TTF at the narrowest screen.
      - name: Check button labels still fit
        run: npm run assets:typefit

      # Same rule for the logo. Icons are the assets most likely to be edited
      # in an image editor and pasted back, which silently decouples them from
      # the licensed master they are supposed to be reproducing.
      - name: Check brand assets are up to date
        run: |
          npm run assets:brand
          if ! git diff --quiet -- assets/icon.png assets/splash-icon.png assets/favicon.png assets/notification-icon.png assets/android-icon-*.png assets/brand; then
            echo "::error::Brand assets are stale. Run 'npm run assets:brand' and commit the result."
            git --no-pager diff --stat -- assets assets/brand
            exit 1
          fi
