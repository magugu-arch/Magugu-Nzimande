name: MAXHOSA app

on:
  push:
    branches: ['**']
    paths: ['maxhosa/**', '.github/workflows/maxhosa.yml']
  pull_request:
    paths: ['maxhosa/**', '.github/workflows/maxhosa.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: maxhosa

jobs:
  verify:
    name: Assets, typecheck, lint, tests, web render, offline demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maxhosa/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The 24-image allowlist, typecheck, lint, formatting and Jest.
      - name: Verify
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Every route through react-native-web: no errors, blank screens or overflow.
      - name: Render the app on web
        run: npm run export:web && npm run shots:web

      # The single-file demo, rebuilt from source and tested with the network cut.
      - name: Build and test the offline demo
        run: npm run demo:build && npm run demo:test
