name: Myron Golden site

# The Next.js site in myron-golden-site/ is independent of the Expo app at
# the repository root: its own lockfile, its own checks. It runs only when
# the site (or this workflow) changes.
on:
  push:
    branches: ['**']
    paths:
      - 'myron-golden-site/**'
      - '.github/workflows/myron-site.yml'
  pull_request:
    paths:
      - 'myron-golden-site/**'
      - '.github/workflows/myron-site.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: myron-golden-site

jobs:
  verify:
    name: Typecheck, lint, format, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myron-golden-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Production build (preview mode)
        run: npm run build

      # The same code must also build with demo data stripped out.
      - name: Production build (production mode)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_MODE: production
          NEXT_PUBLIC_SITE_URL: https://example.com

  e2e:
    name: End-to-end (Chromium, desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: myron-golden-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright
        run: npm run test:e2e
        env:
          CI: 'true'

      # The downloadable single-file copy of the site, opened from disk and exercised.
      - name: Single-file export
        run: npm run export:html && npm run export:check

      - uses: actions/upload-artifact@v4
        with:
          name: myron-golden-site-html
          path: myron-golden-site/dist/myron-golden-site.html
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: myron-golden-site/playwright-report
          retention-days: 7
