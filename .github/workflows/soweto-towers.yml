name: Soweto Towers website

on:
  push:
    branches: ['**']
    paths:
      - 'soweto-towers/**'
      - '.github/workflows/soweto-towers.yml'
  pull_request:
    paths:
      - 'soweto-towers/**'
      - '.github/workflows/soweto-towers.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: soweto-towers

jobs:
  verify:
    name: Typecheck, lint, test, build and browse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # The built-in demo database runs in memory, so CI needs no Postgres.
      PGLITE_MEMORY: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      # The v5 actions run on Node 24; the v4 ones run on Node 20, which
      # GitHub has deprecated and flags on every run.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soweto-towers/package-lock.json

      - name: Install dependencies
        run: npm ci

      # PageProps, LayoutProps and RouteContext are types Next.js generates into
      # .next/types, which a fresh checkout doesn't have. The typecheck script
      # runs `next typegen` first so they exist.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Pure booking rules: prices, bundles, group rates, slots, safety limits.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Real browser runs on an emulated iPhone: book and pay (simulated),
      # buy and redeem a gift voucher, event tickets, chat and Find my jump.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: |
          npm start -- -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/status > /dev/null && break; sleep 1; done
          npm run e2e
        env:
          BASE_URL: http://localhost:3000

      # Only there if the job got as far as starting the server.
      - name: Server log
        if: failure()
        run: if [ -f /tmp/next.log ]; then tail -n 200 /tmp/next.log; else echo "The server was not started, so there is no server log."; fi

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: soweto-towers/tests/e2e/shots
          if-no-files-found: ignore
          retention-days: 7
